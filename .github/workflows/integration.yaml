name: Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CHANGELOG.md","CLAUDE.md","LICENSE","docs/development/ci-change-scope.md","docs/native-concurrency.md","docs/superpowers/plans/2026-10-07-pro-recovery-cleanup.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            bun node_modules/@commitlint/cli/cli.js --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            bun node_modules/@commitlint/cli/cli.js --last --verbose
          fi
  check:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Format, TypeScript and Tests
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require a new version for changed browser artifacts
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BASE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          bun scripts/check-extension-version.mjs "$base"
      - run: bun run check
      - run: bun run test
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Validate Dev Container and runtime Compose
        run: |
          docker compose -f .devcontainer/compose.yaml config --quiet
          docker compose config --quiet
      - name: Verify standalone Compose from empty volumes
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          docker build -t localgpt-compose-ci .
          cat > /tmp/compose-ci.yaml <<'EOF'
          services:
            credentials:
              image: localgpt-compose-ci
            localgpt:
              image: localgpt-compose-ci
          EOF
          docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml up -d --wait --wait-timeout 120 localgpt
          docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml exec -T localgpt bun scripts/verify-compose.mjs
      - name: Clean up test containers
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (always()) }}
        run: docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml down -v || true

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
