name: Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            bun node_modules/@commitlint/cli/cli.js --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            bun node_modules/@commitlint/cli/cli.js --last --verbose
          fi
  check:
    name: Format, TypeScript and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require a new version for changed browser artifacts
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ -n "$PUSH_BASE" ] && [ "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]; then
            base="$PUSH_BASE"
          else
            base="$(git rev-parse HEAD^)"
          fi
          bun scripts/check-extension-version.mjs "$base"
      - run: bun run check
      - run: bun run test
      - name: Validate Dev Container and runtime Compose
        run: |
          docker compose -f .devcontainer/compose.yaml config --quiet
          docker compose config --quiet
      - name: Verify standalone Compose from empty volumes
        run: |
          docker build -t localgpt-compose-ci .
          cat > /tmp/compose-ci.yaml <<'EOF'
          services:
            credentials:
              image: localgpt-compose-ci
            localgpt:
              image: localgpt-compose-ci
          EOF
          docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml up -d --wait --wait-timeout 120 localgpt
          docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml exec -T localgpt bun scripts/verify-compose.mjs
      - name: Clean up test containers
        if: always()
        run: docker compose -p localgpt-ci -f compose.yaml -f /tmp/compose-ci.yaml down -v || true
